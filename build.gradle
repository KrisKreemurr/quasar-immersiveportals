// Quasar MC build of Immersive Portals for NeoForge 26.3 (ModDevGradle, single project).
// Upstream: iPortalTeam/ImmersivePortalsModForNeo, branch 1.21 (Apache-2.0). Changes are listed in QUASAR-CHANGES.md.

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+${minecraft_version}-quasar"
group = 'qouteall'
base.archivesName = 'QuasarImmersivePortals'

// Minecraft 26.x requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main {
    // Other mods' compat (Sodium, Iris) and the Cloth Config screen: none of these are in Quasar MC's pack.
    java.exclude 'qouteall/imm_ptl/core/compat/mixin/sodium/**', 'qouteall/imm_ptl/core/compat/mixin/iris/**',
            'qouteall/imm_ptl/core/compat/sodium_compatibility/**', 'qouteall/imm_ptl/core/compat/iris_compatibility/**',
            'qouteall/imm_ptl/core/platform_specific/IPConfigGUI.java'
    resources.exclude 'fabric.mod.json', 'imm_ptl.accesswidener'
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        immersive_portals_core {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // MixinExtras ships with NeoForge at runtime; this is only for compiling.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range, issue_tracker_url: issue_tracker_url,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description, pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '20000']
}
